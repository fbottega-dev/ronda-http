name: Verificação

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Go ${{ matrix.go }} / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        go: ['1.26.x', '1.27.x']
        include:
          - os: macos-15
            go: '1.27.x'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - name: Formatação
        shell: bash
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "$files"
            exit 1
          fi
      - run: go vet ./...
      - run: go test ./... -count=1 -cover
      - run: go build -o bin/ ./cmd/ronda
      - name: Detector de condições de corrida
        if: runner.os == 'Linux' && matrix.go == '1.27.x'
        run: go test -race ./... -count=1

  package:
    name: Distribuição portátil
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.27.x'
          cache: false
      - name: Empacotar executáveis e checksums
        run: go run ./scripts/package --version 1.0.0 --output dist
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: ronda-http-1.0.0
          path: dist/
          retention-days: 7
          if-no-files-found: error
